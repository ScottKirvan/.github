name: Reusable — Update Changelog with PR Links

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to add PR links for
        required: true
        type: string
      changelog_path:
        description: Path to changelog file relative to repo root
        required: false
        type: string
        default: notes/CHANGELOG.md

permissions:
  contents: write

jobs:
  update-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Replace commit SHA links with PR links in changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          REPO: ${{ github.repository }}
        run: |
          # Find the previous release tag
          PREV_TAG=$(gh release list --repo "$REPO" --limit 50 --json tagName \
            | jq -r --arg tag "$TAG" \
            '[.[].tagName] | index($tag) as $i | if $i != null and $i < (length - 1) then .[$i + 1] else "null" end')

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "No previous release found — skipping PR link update"
            exit 0
          fi

          echo "Comparing $PREV_TAG → $TAG"

          # Get commit SHAs between the two tags
          SHAS=$(gh api "repos/$REPO/compare/${PREV_TAG}...${TAG}" \
            --jq '[.commits[].sha] | .[]' 2>/dev/null || true)

          if [ -z "$SHAS" ]; then
            echo "No commits found between tags — skipping"
            exit 0
          fi

          # Build full_sha → PR number + URL mapping
          : > /tmp/sha_pr_map.txt
          while IFS= read -r SHA; do
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '.[0] | select(. != null) | "\(.number)\t\(.html_url)"' \
              2>/dev/null) || true
            if [ -n "$PR" ]; then
              printf '%s\t%s\n' "$SHA" "$PR" >> /tmp/sha_pr_map.txt
            fi
          done <<< "$SHAS"

          if [ ! -s /tmp/sha_pr_map.txt ]; then
            echo "No PRs found for this release — skipping"
            exit 0
          fi

          echo "SHA-to-PR map:"
          cat /tmp/sha_pr_map.txt

          # Replace commit SHA links inline using Python
          python3 << 'PYEOF'
          import re, os

          repo    = os.environ['REPO']
          tag     = os.environ['TAG']
          cl_path = os.environ['CHANGELOG_PATH']

          # Load SHA -> (pr_num, pr_url) mapping
          sha_to_pr = {}
          with open('/tmp/sha_pr_map.txt') as f:
              for line in f:
                  parts = line.rstrip('\n').split('\t')
                  if len(parts) == 3:
                      full_sha, pr_num, pr_url = parts
                      sha_to_pr[full_sha] = (pr_num, pr_url)

          with open(cl_path) as f:
              content = f.read()

          # Pattern: ([display_sha](https://github.com/owner/repo/commit/full_sha))
          # display_sha is typically 7 chars; full_sha is in the URL
          commit_re = re.compile(
              r'\(([0-9a-f]{6,40})\)'
              r'\(https://github\.com/[^/]+/[^/]+/commit/([0-9a-f]{40})\)'
          )

          def replace_sha(m):
              full_sha = m.group(2)
              if full_sha in sha_to_pr:
                  pr_num, pr_url = sha_to_pr[full_sha]
                  return f'([#{pr_num}]({pr_url}))'
              return m.group(0)  # no PR found - leave SHA link as-is

          updated = commit_re.sub(replace_sha, content)

          if updated == content:
              print('No commit SHA links matched - nothing to replace')
          else:
              with open(cl_path, 'w') as f:
                  f.write(updated)
              print(f'Replaced commit SHA links with PR links in {cl_path}')
          PYEOF

          # Commit if the file changed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG_PATH"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: replace commit SHA links with PR links in changelog for $TAG"
          git push
